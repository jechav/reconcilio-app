name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reconcilio
          POSTGRES_PASSWORD: reconcilio
          POSTGRES_DB: reconcilio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reconcilio:reconcilio@localhost:5432/reconcilio_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Started by hand, not as a service container: the image needs a
      # `server <dir>` command, which service containers can't pass. The
      # document upload tests call ensure_bucket() against it. Uses the
      # Chainguard build because minio/minio is no longer on Docker Hub.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 chainguard/minio server /tmp/data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
