[project]
name = "reconcilio-backend"
version = "0.1.0"
description = "Reconcilio API and worker"
requires-python = ">=3.12"
dependencies = [
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
    "minio>=7.2",
    "langgraph>=0.2",
    "boto3>=1.43.86",
    "httpx>=0.27",
    "litellm>=1.99.0",
    "pypdf>=5.1",
    "litestar>=2.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Litestar 3.0 removes implicit path/query/dependency parameters; fail on any
# use of a deprecated Litestar API so the port stays 3.0-ready.
filterwarnings = ["error::litestar.exceptions.LitestarDeprecationWarning"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "minio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
